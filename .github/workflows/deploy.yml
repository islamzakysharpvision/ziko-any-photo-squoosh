name: Build and Deploy Squoosh

on:
  push:
    branches:
      - dev # Squoosh uses 'dev' as its main branch name
  workflow_dispatch: # Allows you to manually trigger it

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/tools/node@v4
        with:
          node-size: 18 # Stable version for building Squoosh dependencies

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # Squoosh outputs compiled files here
          branch: gh-pages # The target live branch
